name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Zendesk 内容同步已拆到 zendesk-sync.yml:它提交完会显式派发本 workflow。
  # 这里保留一个错峰的定时兜底(:37 而非 :17),万一那次派发没成,Pages 也不会
  # 长期停更。
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: read # 同步搬走后这里不再写仓库
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 必须有:2026-07-30~09-24 期间 bun install 无限挂起(lockfile 里全是内网
    # URL,runner 连不上,TCP 丢包不回所以只干等不报错),单次占满 6 小时,
    # 把后续 100 次 run 全挤成 cancelled —— 从头到尾没有一次 failed 通知,
    # 于是烂了近两个月没人发现。超时是让下次能被发现。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # frozen:lockfile 与 package.json 不一致时直接失败,不静默改写
      - run: bun install --frozen-lockfile

      # 三个 region app 各自独立构建(monorepo:apps/hk apps/sg apps/us,
      # 共享层在 packages/shared)。每个 app base=/{region}/,产物合并后
      # 对外 URL 与拆分前的单实例时代完全一致。
      - name: Build all region apps
        run: bun run build

      - name: Merge dists (single-domain layout)
        run: |
          mkdir -p dist
          cp -r apps/hk/docs/.vitepress/dist dist/hk
          cp -r apps/sg/docs/.vitepress/dist dist/sg
          # us migrated to Astro (outDir apps/us/dist); hk/sg remain VitePress
          cp -r apps/us/dist dist/us
          # 根 404 兜底(GitHub Pages 只认根 /404.html);hk 产物的 404 引用
          # /hk/assets/* 绝对路径,放到根也能正常工作
          cp apps/hk/docs/.vitepress/dist/404.html dist/404.html
          # 根路径重定向到默认 region
          cp .github/pages-root/index.html dist/index.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    # 同理:deploy 卡住也会占住 group:pages 拖垮后续 run
    timeout-minutes: 15
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
